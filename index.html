<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impulso Rosa</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="./imgs/logo_icono.png">
</head>
<body>

  <!-- Sidebar / navbar izquierdo -->
  <nav class="sidebar">
    <div class="logo">
      <img src="./imgs/logo_icono.png" class="logo-icono" alt="Logo de Impulso Rosa">
    </div>

    <ul class="menu">
      <li><a href="#" class="enlace-menu activo" data-pagina="pagina-mapa">Mapa Conceptual</a></li>
      <li><a href="#" class="enlace-menu" data-pagina="pagina-reflexion">Reflexión</a></li>
      <li><a href="#" class="enlace-menu" data-pagina="pagina-noticia">Noticia Jurídica</a></li>
      <li><a href="#" class="enlace-menu" data-pagina="pagina-nosotros">Nosotros</a></li>
    </ul>
  </nav>

  <!-- Contenido principal: una "página" por sección, se muestra una a la vez -->
  <div class="contenido">

    <div class="logo-texto">
      <img src="./imgs/logo_texto.png" class="logo-texto-img" alt="Logo de Impulso Rosa">
    </div>

    <section id="pagina-mapa" class="pagina activa">
      <header style="display:none">
        <h1>Mapa Conceptual</h1>
      </header>

      <div class="mapa-scroll">
        <div id="mapa" class="mapa">
          <svg id="flechas" class="flechas"></svg>
        </div>
      </div>
    </section>

    <section id="pagina-reflexion" class="pagina">
      <header style="display:none">
        <h1>Reflexión</h1>
      </header>
      <!-- Página en blanco: completar más adelante -->
    </section>

    <section id="pagina-noticia" class="pagina">
      <header style="display:none">
        <h1>Noticia Jurídica</h1>
      </header>
      <!-- Página en blanco: completar más adelante -->
    </section>

    <section id="pagina-nosotros" class="pagina">
      <header style="display:none">
        <h1>Nosotros</h1>
      </header>
      <!-- Página en blanco: completar más adelante -->
    </section>

  </div>

  <!-- Popup / Modal -->
  <div id="overlay" class="overlay">
    <div class="popup">
      <button id="cerrarPopup" class="cerrar">&times;</button>
      <h2 id="popupTitulo"></h2>
      <p id="popupDescripcion"></p>
      <img id="popupImagen" class="popup-imagen" src="" alt="">
      <div id="popupVideoContenedor" class="popup-video"></div>
    </div>
  </div>

  <script src="datos-mapa.js"></script>
  <script src="script.js"></script>
</body>
</html>
